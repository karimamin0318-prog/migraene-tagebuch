<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-nAohl2XzXD4HA1jgxmZ/HgIdoBMa9V5uqrNVazENG5A='; style-src 'unsafe-inline'; img-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Migräne-Tagebuch</title>
<meta name="description" content="Persönliches Tagebuch für Migräne und Kopfschmerzen">
<meta name="theme-color" content="#f4f5fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11121a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Migräne">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* Eine Spalte fürs Handy, feste Tab-Leiste unten. Farben als Tokens, Dunkelmodus folgt dem System. */
:root {
  --bg: #f4f5fa; --surface: #fff; --fg: #1b1d2a; --muted: #676b82; --line: #e2e4ee;
  --mig: #6a3fd2; --mig-soft: #ece5fc; --on-mig: #fff;
  --head: #d97f12; --head-soft: #fcefdb; --on-head: #fff;
  --chip: #eef0f6; --chip-on: #1b1d2a; --on-chip-on: #fff; --danger: #c23b3b; --ok: #3aa66a;
  --font-display: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  --tabbar-h: 62px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11121a; --surface: #1a1c28; --fg: #eceef7; --muted: #9a9eb6; --line: #2a2d3e;
    --mig: #9c7cff; --mig-soft: #2a2250; --on-mig: #12101f;
    --head: #f3a548; --head-soft: #3a2a12; --on-head: #1d1305;
    --chip: #242737; --chip-on: #eceef7; --on-chip-on: #11121a; --danger: #ff7a7a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { background: var(--bg); padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 var(--font-body); -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
[hidden] { display: none !important; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--mig); outline-offset: 2px; }

.app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 14px calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom, 0px)); }
.view { display: flex; flex-direction: column; gap: 18px; }
h1, h2 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 1.7rem; }
h2 { font-size: 1.15rem; }
.eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.num, .tile b, .rank-row, .cell, .wkd, .dose-n, .scale { font-variant-numeric: tabular-nums; }
.status { margin: 0; font-size: 0.75rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.status i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.callout { background: var(--mig-soft); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; font-size: 0.9rem; }
.callout strong { font-family: var(--font-display); font-size: 1rem; }

/* Tag */
.dayhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.dayhead .center { text-align: center; flex: 1; min-width: 0; }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 1.2rem; flex: none; }
.iconbtn:disabled { opacity: 0.35; cursor: default; }
.todaylink { border: 0; background: var(--chip); border-radius: 999px; padding: 3px 12px; font-size: 0.8rem; font-weight: 600; margin-top: 4px; }
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.bigbtn { border-radius: 22px; border: 0; padding: 22px 12px 18px; min-height: 128px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 1.05rem; transition: transform .12s, background .15s; }
.bigbtn:active { transform: scale(0.97); }
.bigbtn svg { width: 40px; height: 40px; }
.bigbtn small { font-weight: 500; font-size: 0.75rem; opacity: 0.85; }
.bigbtn.mig { background: var(--mig-soft); color: var(--mig); }
.bigbtn.head { background: var(--head-soft); color: var(--head); }
.bigbtn.mig[aria-pressed="true"] { background: var(--mig); color: var(--on-mig); }
.bigbtn.head[aria-pressed="true"] { background: var(--head); color: var(--on-head); }
.hint { text-align: center; font-size: 0.85rem; color: var(--muted); margin: -6px 0 0; }
.intensity { display: flex; flex-direction: column; gap: 8px; }
.scale { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.scale button { border: 0; border-radius: 10px; padding: 9px 0; background: var(--chip); font-weight: 600; font-size: 0.9rem; }
.scale button[aria-pressed="true"] { background: var(--mig); color: var(--on-mig); }
.scale[data-type="headache"] button[aria-pressed="true"] { background: var(--head); color: var(--on-head); }

details.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 4px 16px; }
details.sec[open] { padding-bottom: 16px; }
details.sec > summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 12px 0; cursor: pointer; }
details.sec > summary::-webkit-details-marker { display: none; }
summary .count { background: var(--fg); color: var(--bg); border-radius: 999px; font-size: 0.75rem; font-weight: 700; padding: 1px 8px; }
summary .chev { margin-left: auto; color: var(--muted); transition: transform .2s; }
details[open] > summary .chev { transform: rotate(180deg); }
.sec-tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; margin: -2px 0 10px; font-size: 0.78rem; color: var(--muted); }
.linkbtn { background: none; border: 0; color: var(--mig); font-weight: 600; font-size: 0.85rem; padding: 4px 0; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; overflow: hidden; border: 1px solid transparent; background: var(--chip); border-radius: 999px; padding: 8px 14px; font-size: 0.92rem; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.chip[aria-pressed="true"] { background: var(--chip-on); color: var(--on-chip-on); }
.chip.custom::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .5; }
.chip.add { background: transparent; border: 1.5px dashed var(--line); color: var(--muted); }
/* Füllung beim Gedrückthalten: 120 ms Verzögerung + 880 ms = HOLD_MS im Skript */
.chip.pressing::before { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0.18; transform: scaleX(0); transform-origin: left; animation: hold 880ms linear 120ms forwards; }
@keyframes hold { to { transform: scaleX(1); } }
.chip.lifted { opacity: 0.25; }
.chip.ghost { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; margin: 0; max-width: calc(100vw - 32px); white-space: nowrap; background: var(--chip-on); color: var(--on-chip-on); box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28); }
.addform { display: flex; gap: 8px; width: 100%; }
.addform input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 8px 14px; }
.addform button { border: 0; border-radius: 999px; padding: 8px 16px; background: var(--fg); color: var(--bg); font-weight: 600; }
.addform button.ghost { background: var(--chip); color: var(--fg); }
.doses { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.doses:empty { display: none; }
.dose { display: flex; align-items: center; gap: 10px; background: var(--bg); border-radius: 14px; padding: 6px 6px 6px 14px; }
.dose-name { flex: 1; min-width: 0; font-weight: 600; font-size: 0.92rem; overflow-wrap: anywhere; }
.dose-n { min-width: 2.4em; text-align: center; font-weight: 700; font-size: 1.05rem; }
.step { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 1.2rem; font-weight: 600; display: grid; place-items: center; }
.step:disabled { opacity: 0.35; cursor: default; }
textarea#note { width: 100%; min-height: 120px; border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--bg); resize: vertical; line-height: 1.5; }
.savehint { font-size: 0.75rem; color: var(--muted); margin-top: 6px; min-height: 1em; }

.trash { position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 24px + env(safe-area-inset-bottom, 0px)); width: 68px; height: 68px; border-radius: 50%; background: var(--surface); border: 2px solid var(--danger); color: var(--danger); display: grid; place-items: center; z-index: 25; pointer-events: none; opacity: 0; transform: translate(-50%, 40px) scale(0.6); transition: opacity .18s, transform .18s, background .15s; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18); }
.trash svg { width: 30px; height: 30px; }
.trash span { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 0.75rem; font-weight: 600; background: var(--fg); color: var(--bg); padding: 4px 10px; border-radius: 999px; }
.trash.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
.trash.hot { background: var(--danger); color: #fff; transform: translate(-50%, 0) scale(1.2); }

/* Kalender */
.calnav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.calnav > div { text-align: center; }
.calnav h2 { font-size: 1.3rem; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal .wd { text-align: center; font-size: 0.72rem; color: var(--muted); font-weight: 600; padding-bottom: 2px; }
.cell { aspect-ratio: 1; max-width: 100%; border-radius: 12px; border: 0; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-weight: 600; font-size: 0.95rem; }
.cell.out { visibility: hidden; }
.cell.future { opacity: 0.4; }
.cell.mig { background: var(--mig); color: var(--on-mig); }
.cell.head { background: var(--head); color: var(--on-head); }
.cell.today { box-shadow: inset 0 0 0 2px var(--fg); }
.cell .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: 0.55; }
.cell .dot.none { opacity: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.82rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
.sw.mig { background: var(--mig); }
.sw.head { background: var(--head); }
.sw.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); margin-inline: 4px; }

/* Notizen */
.search { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 11px 14px; }
.monthgroup { display: flex; flex-direction: column; gap: 10px; }
.note-item { text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.note-item .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.note-item p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.badge { font-size: 0.72rem; font-weight: 700; border-radius: 999px; padding: 2px 9px; }
.badge.mig { background: var(--mig-soft); color: var(--mig); }
.badge.head { background: var(--head-soft); color: var(--head); }
.minichips { display: flex; flex-wrap: wrap; gap: 5px; }
.minichips span { font-size: 0.74rem; background: var(--chip); border-radius: 999px; padding: 2px 8px; color: var(--muted); }
.minichips .med { background: var(--fg); color: var(--bg); }
mark { background: var(--head-soft); color: inherit; border-radius: 3px; }

/* Statistik & Einstellungen */
.seg { display: grid; grid-auto-columns: 1fr; grid-auto-flow: column; background: var(--chip); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 7px 0; font-size: 0.85rem; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile b { font-family: var(--font-display); font-size: 1.7rem; line-height: 1.1; }
.tile.mig b { color: var(--mig); }
.tile.head b { color: var(--head); }
.tile span { font-size: 0.8rem; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel > p { margin: 0; }
.panel .lead { margin-top: -6px; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--font-body); }
.rank { display: flex; flex-direction: column; gap: 10px; }
.rank-row { display: grid; grid-template-columns: 22px 1fr auto; gap: 4px 10px; align-items: center; }
.rank-row .pos { font-size: 0.8rem; color: var(--muted); text-align: right; }
.rank-row .name { font-weight: 600; font-size: 0.92rem; min-width: 0; overflow-wrap: anywhere; }
.rank-row .val { font-weight: 700; font-size: 0.92rem; }
.rank-row .bar { grid-column: 2 / 4; height: 7px; border-radius: 4px; background: var(--chip); overflow: hidden; }
.rank-row .bar i { display: block; height: 100%; border-radius: 4px; background: var(--fill); }
.rank-row .sub { grid-column: 2 / 4; font-size: 0.75rem; color: var(--muted); margin-top: -4px; }
.wkd { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 110px; }
.wkd div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; font-size: 0.72rem; color: var(--muted); }
.wkd i { display: block; width: 100%; border-radius: 6px 6px 3px 3px; min-height: 2px; }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; align-items: center; }
.empty strong { color: var(--fg); font-family: var(--font-display); font-size: 1.05rem; }
.btn { border: 0; border-radius: 12px; padding: 11px 16px; background: var(--fg); color: var(--bg); font-weight: 600; }
.btn.ghost { background: var(--chip); color: var(--fg); }
.btn.danger { background: var(--danger); color: #fff; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.subhead { font-size: 0.8rem; font-weight: 700; margin-top: 4px; }
.importbox { border: 1.5px dashed var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.importbox strong { overflow-wrap: anywhere; }
.importbox .opt { display: flex; flex-direction: column; gap: 4px; }
.importbox .opt span { font-size: 0.78rem; color: var(--muted); }
.msg { font-size: 0.85rem; margin: 0; }
.msg.err { color: var(--danger); }

/* Tab-Leiste & Meldungen */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 10; }
.tabbar nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: var(--tabbar-h); }
.tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 0; padding: 0 2px; font-size: 0.64rem; font-weight: 600; color: var(--muted); }
.tabbar button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabbar svg { width: 24px; height: 24px; flex: none; }
.tabbar button[aria-selected="true"] { color: var(--mig); }
.toast { position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom, 0px)); width: max-content; max-width: calc(100vw - 32px); transform: translateX(-50%) translateY(10px); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 18px; font-size: 0.85rem; font-weight: 600; text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 20; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.action { pointer-events: auto; }
.toast button { background: none; border: 0; color: inherit; font-weight: 700; text-decoration: underline; padding: 0 0 0 10px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <!-- TAG -->
  <section class="view" id="v-tag">
    <div class="dayhead">
      <button class="iconbtn" data-act="prevDay" data-i18n-aria="prevDay">‹</button>
      <div class="center">
        <div class="eyebrow" id="dayEyebrow"></div>
        <h1 id="dayTitle"></h1>
        <button class="todaylink" data-act="goToday" id="todayLink" data-i18n="backToday" hidden></button>
      </div>
      <button class="iconbtn" data-act="nextDay" id="nextDayBtn" data-i18n-aria="nextDay">›</button>
    </div>

    <div class="choice">
      <button class="bigbtn mig" data-act="setType" data-v="migraine" id="btnMig" aria-pressed="false">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 4 11 22h9l-3 14 12-19h-9z"/></svg>
        <span data-i18n="migraine"></span>
        <small id="migSub"></small>
      </button>
      <button class="bigbtn head" data-act="setType" data-v="headache" id="btnHead" aria-pressed="false">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="20" cy="22" r="11"/><path d="M9 9l4 4M31 9l-4 4M20 4v5"/></svg>
        <span data-i18n="headache"></span>
        <small id="headSub"></small>
      </button>
    </div>
    <p class="hint" id="typeHint"></p>

    <div class="intensity" id="intensityWrap" hidden>
      <div class="eyebrow" data-i18n="intensity"></div>
      <div class="scale" id="scale"></div>
    </div>

    <details class="sec" open>
      <summary><h2 data-i18n="secM"></h2><span class="count num" id="cntM" hidden></span><span class="chev">▾</span></summary>
      <div class="sec-tools" id="toolsM"></div>
      <div class="chips" id="chipsM"></div>
      <div class="doses" id="doses"></div>
    </details>

    <details class="sec" open>
      <summary><h2 data-i18n="secT"></h2><span class="count num" id="cntT" hidden></span><span class="chev">▾</span></summary>
      <div class="sec-tools" id="toolsT"></div>
      <div class="chips" id="chipsT"></div>
    </details>

    <details class="sec" open>
      <summary><h2 data-i18n="secS"></h2><span class="count num" id="cntS" hidden></span><span class="chev">▾</span></summary>
      <div class="sec-tools" id="toolsS"></div>
      <div class="chips" id="chipsS"></div>
    </details>

    <details class="sec" open>
      <summary><h2 data-i18n="secN"></h2><span class="chev">▾</span></summary>
      <textarea id="note" data-i18n-ph="notePh" data-i18n-aria="secN"></textarea>
      <div class="savehint" id="saveHint"></div>
    </details>

    <div class="callout" id="backupBox" hidden></div>
    <p class="status"><i></i><span data-i18n="status"></span></p>
  </section>

  <!-- KALENDER -->
  <section class="view" id="v-cal" hidden>
    <div class="calnav">
      <button class="iconbtn" data-act="prevMonth" data-i18n-aria="prevMonth">‹</button>
      <div><div class="eyebrow" id="calYear"></div><h2 id="calTitle"></h2></div>
      <button class="iconbtn" data-act="nextMonth" data-i18n-aria="nextMonth">›</button>
    </div>
    <div class="cal" id="cal"></div>
    <div class="legend"><span><i class="sw mig"></i><span data-i18n="migraine"></span></span><span><i class="sw head"></i><span data-i18n="headache"></span></span><span><i class="sw dot"></i><span data-i18n="legendExtra"></span></span></div>
    <div class="tiles" id="monthSum"></div>
    <p class="muted small" style="margin:0" data-i18n="calHint"></p>
  </section>

  <!-- NOTIZEN -->
  <section class="view" id="v-notes" hidden>
    <h1 data-i18n="tabNotes"></h1>
    <input class="search" id="noteSearch" type="search" autocomplete="off" data-i18n-ph="searchPh" data-i18n-aria="searchPh">
    <div id="notesList" class="view"></div>
  </section>

  <!-- STATISTIK -->
  <section class="view" id="v-stats" hidden>
    <h1 data-i18n="tabStats"></h1>
    <div class="seg" id="rangeSeg" role="group" data-i18n-aria="range"></div>
    <div id="statsBody" class="view"></div>
  </section>

  <!-- EINSTELLUNGEN -->
  <section class="view" id="v-set" hidden>
    <h1 data-i18n="tabSet"></h1>
    <div id="setBody" class="view"></div>
  </section>
</div>

const counter = () => Object.create(null); // Zählobjekt ohne geerbte Schlüssel
const inc = (map, key, by = 1) => { map[key] = (map[key] || 0) + by; };
const union = (a, b) => [...a, ...b.filter(x => !a.includes(x))];
const strList = v => Array.isArray(v) ? [...new Set(v.filter(x => typeof x === "string" && x.trim()))] : [];
const sortByCount = map => Object.entries(map).sort((a, b) => b[1] - a[1] || nameOf(a[0]).localeCompare(nameOf(b[0]), L.locale));
const own = (obj, key) => Object.prototype.hasOwnProperty.call(obj, key);
const typeName = t => t === "migraine" ? tr("migraine") : t === "headache" ? tr("headache") : "";

function setLang(l) {
  lang = TEXT[l] ? l : "de";
  L = TEXT[lang];
  const f = opts => new Intl.DateTimeFormat(L.locale, opts);
  fmtLong = f({ weekday: "long", day: "numeric", month: "long" });
  fmtMonth = f({ month: "long" });
  fmtMonthShort = f({ month: "short" });
  fmtShort = f({ weekday: "short", day: "numeric", month: "long" });
  fmtDate = f({ day: "numeric", month: "numeric", year: "numeric" });
  fmtNum = new Intl.NumberFormat(L.locale, { maximumFractionDigits: 1 });
  document.documentElement.lang = lang;
  document.title = L.appTitle;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = tr(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = tr(el.dataset.i18nPh); });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => { el.setAttribute("aria-label", tr(el.dataset.i18nAria)); });
}

// ---------- Datenmodell: ein Eintrag pro Tag ----------
function normDay(raw) {
  const meds = strList(raw?.meds), medCounts = {};
  meds.forEach(m => {
    const n = raw.medCounts?.[m];
    if (Number.isInteger(n) && n > 1) medCounts[m] = Math.min(n, MAX_DOSE);
  });
  const i = raw?.intensity;
  return {
    type: raw?.type === "migraine" || raw?.type === "headache" ? raw.type : null,
    intensity: Number.isInteger(i) && i >= 1 && i <= 10 ? i : null,
    triggers: strList(raw?.triggers),
    symptoms: strList(raw?.symptoms),
    meds, medCounts,
    note: typeof raw?.note === "string" ? raw.note : ""
  };
}
const isEmptyDay = d => !d || (!d.type && !d.triggers.length && !d.symptoms.length && !d.meds.length && !d.note.trim());
const doseOf = (d, m) => own(d.medCounts, m) ? d.medCounts[m] : 1;

// ---------- Zustand ----------
const S = {
  days: {},
  ...Object.fromEntries(LIST_KEYS.map(k => [k, []])),
  tab: "tag",
  date: todayKey(),
  onToday: true,   // springt automatisch auf den neuen Tag, wenn die App über Mitternacht offen bleibt
  calMonth: todayKey().slice(0, 7),
  range: "90",
  query: "",
  adding: null,    // Liste, in der gerade ein eigener Eintrag getippt wird
  imp: null,       // Import-Vorschau { p, confirm }
  importMsg: "",
  importErr: false
};
const getDay = k => S.days[k] || normDay();
const lists = () => Object.fromEntries(LIST_KEYS.map(k => [k, S[k]]));

// ---------- Speichern (nur auf diesem Gerät) ----------
const readLS = key => { try { return localStorage.getItem(key); } catch { return null; } };
const writeLS = (key, val) => { try { localStorage.setItem(key, val); return true; } catch { return false; } };
const readNum = key => Number(readLS(key)) || 0;

function load() {
  let c = null;
  try { c = JSON.parse(readLS(DATA_KEY) || "null"); } catch {}
  S.days = {};
  for (const [k, v] of Object.entries(c?.days || {})) if (isDateKey(k)) S.days[k] = normDay(v);
  LIST_KEYS.forEach(k => { S[k] = strList(c?.[k]); });
}

let saveTimer = 0;
function save() {
  clearTimeout(saveTimer);
  saveTimer = 0;
  for (const k of Object.keys(S.days)) if (isEmptyDay(S.days[k])) delete S.days[k];
  if (!writeLS(DATA_KEY, JSON.stringify({ days: S.days, ...lists() }))) toast(tr("saveFailed"));
}
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 400); }
const flush = () => { if (saveTimer) save(); };

function mutate(fn, later = false) {
  const d = normDay(getDay(S.date));
  fn(d);
  S.days[S.date] = normDay(d);
  later ? saveSoon() : save();
}

// Nach Mitternacht wieder „heute“ anzeigen, falls die App im Hintergrund offen war
function syncToday() {
  const tk = todayKey();
  if (!S.onToday || S.date === tk) return false;
  S.date = tk;
  S.calMonth = tk.slice(0, 7);
  S.adding = null;
  return true;
}
function goDay(k) {
  S.date = k;
  S.onToday = k === todayKey();
  S.adding = null;
}

// ---------- Meldung unten ----------
let toastTimer;
function toast(msg, action) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.toggle("action", !!action);
  if (action) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = action.label;
    b.addEventListener("click", ev => { ev.stopPropagation(); el.classList.remove("show", "action"); action.fn(); });
    el.appendChild(b);
  }
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show", "action"), action ? 5000 : 1700);
}

// ---------- Tab „Tag“ ----------
function chipHTML(kind, sel) {
  const K = KINDS[kind], custom = S[K.custom];
  const list = union(K.defaults.filter(x => !S[K.hidden].includes(x)), custom);
  const orphans = sel.filter(x => !list.includes(x)); // gewählt, aber inzwischen aus der Liste gelöscht
  return [...list, ...orphans].map(v =>
    `<button class="chip${custom.includes(v) ? " custom" : ""}${orphans.includes(v) ? " orphan" : ""}" data-act="tog" data-k="${kind}" data-v="${esc(v)}" aria-pressed="${sel.includes(v)}">${esc(nameOf(v))}</button>`
  ).join("") + (S.adding === kind
    ? `<form class="addform" data-form="${kind}"><input id="addInput" maxlength="40" placeholder="${esc(tr("ph" + kind))}" autocomplete="off" enterkeyhint="done" aria-label="${esc(tr("add" + kind))}"><button type="submit">${tr("add")}</button><button type="button" class="ghost" data-act="cancelAdd">${tr("cancel")}</button></form>`
    : `<button class="chip add" data-act="add" data-k="${kind}">+ ${esc(tr("add" + kind))}</button>`);
}

function renderTag() {
  const k = S.date, d = getDay(k), tk = todayKey(), diff = daysBetween(k, tk);
  const draft = $("addInput"), draftText = draft?.value || "", draftFocus = !!draft && document.activeElement === draft;

  $("dayEyebrow").textContent = diff === 0 ? tr("today") : diff === 1 ? tr("yesterday") : parseKey(k).getFullYear();
  $("dayTitle").textContent = fmtLong.format(parseKey(k));
  $("todayLink").hidden = diff === 0;
  $("nextDayBtn").disabled = k >= tk;
  for (const [btn, sub, type] of [["btnMig", "migSub", "migraine"], ["btnHead", "headSub", "headache"]]) {
    $(btn).setAttribute("aria-pressed", d.type === type);
    $(sub).textContent = d.type === type ? tr("subLogged") : diff === 0 ? tr("subToday") : tr("subPast");
  }
  $("typeHint").textContent = d.type ? tr("hintSel") : diff === 0 ? tr("hintToday") : tr("hintPast");

  $("intensityWrap").hidden = !d.type;
  const sc = $("scale");
  sc.dataset.type = d.type || "";
  sc.innerHTML = Array.from({ length: 10 }, (_, i) => `<button data-act="setInt" data-v="${i + 1}" aria-pressed="${d.intensity === i + 1}">${i + 1}</button>`).join("");

  for (const kind of KIND_KEYS) {
    const K = KINDS[kind], sel = d[K.field], nHidden = S[K.hidden].length;
    $("chips" + kind).innerHTML = chipHTML(kind, sel);
    $("tools" + kind).innerHTML = `<span>${tr("delHint")}</span>` +
      (nHidden ? `<button class="linkbtn" data-act="restore" data-k="${kind}">${tr("restore", nHidden)}</button>` : "");
    const c = $("cnt" + kind);
    c.hidden = !sel.length;
    c.textContent = sel.length;
  }
  $("doses").innerHTML = d.meds.map(m => {
    const n = doseOf(d, m), v = esc(m), name = esc(nameOf(m));
    return `<div class="dose"><span class="dose-name">${name}</span>` +
      `<button class="step" data-act="doseDec" data-v="${v}" aria-label="${n === 1 ? esc(tr("doseDel", nameOf(m))) : tr("doseLess")}">${n === 1 ? "✕" : "−"}</button>` +
      `<span class="dose-n">${n}×</span>` +
      `<button class="step" data-act="doseInc" data-v="${v}" aria-label="${tr("doseMore")}"${n >= MAX_DOSE ? " disabled" : ""}>+</button></div>`;
  }).join("");

  // Begonnene Eingabe eines eigenen Eintrags beim Neuzeichnen behalten
  const input = $("addInput");
  if (input) { input.value = draftText; if (draftFocus) input.focus(); }
  const ta = $("note");
  if (ta.dataset.date !== k || document.activeElement !== ta) { ta.value = d.note; ta.dataset.date = k; }
  renderBackupHint();
}

// Eintrag aus der Auswahlliste löschen (bereits erfasste Tage behalten ihn)
function deleteItem(kind, v) {
  const K = KINDS[kind];
  const wasCustom = S[K.custom].includes(v);
  if (wasCustom) S[K.custom] = S[K.custom].filter(x => x !== v);
  else if (K.defaults.includes(v) && !S[K.hidden].includes(v)) S[K.hidden] = [...S[K.hidden], v];
  else return;
  save();
  renderTag();
  toast(tr("deleted", nameOf(v)), {
    label: tr("undo"),
    fn: () => {
      if (wasCustom) S[K.custom] = union(S[K.custom], [v]);
      else S[K.hidden] = S[K.hidden].filter(x => x !== v);
      save();
      renderTag();
      toast(tr("isBack", nameOf(v)));
    }
  });
}

// ---------- Tab „Kalender“ ----------
function renderCal() {
  const first = parseKey(S.calMonth + "-01"), y = first.getFullYear(), m = first.getMonth() + 1;
  const len = new Date(y, m, 0).getDate(), tk = todayKey(), month = fmtMonth.format(first);
  let h = L.weekdays.map(w => `<div class="wd">${w}</div>`).join("") + `<div class="cell out"></div>`.repeat((first.getDay() + 6) % 7);
  let mig = 0, head = 0;
  for (let dd = 1; dd <= len; dd++) {
    const k = `${y}-${pad(m)}-${pad(dd)}`, d = S.days[k], cls = ["cell"];
    if (d?.type === "migraine") { cls.push("mig"); mig++; }
    if (d?.type === "headache") { cls.push("head"); head++; }
    if (k === tk) cls.push("today");
    if (k > tk) cls.push("future");
    const extra = d && (d.triggers.length || d.symptoms.length || d.meds.length || d.note.trim());
    const label = fmtLong.format(parseKey(k)) + (d?.type ? ", " + typeName(d.type) : "");
    h += `<button class="${cls.join(" ")}" data-act="openDay" data-v="${k}"${k > tk ? " disabled" : ""} aria-label="${label}">${dd}<span class="dot${extra ? "" : " none"}"></span></button>`;
  }
  $("calYear").textContent = y;
  $("calTitle").textContent = month;
  $("cal").innerHTML = h;
  $("monthSum").innerHTML =
    `<div class="tile mig"><b>${mig}</b><span>${tr("migIn", month)}</span></div>` +
    `<div class="tile head"><b>${head}</b><span>${tr("headIn", month)}</span></div>`;
}

// ---------- Tab „Notizen“ ----------
function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "gi");
  return text.split(re).map((part, i) => i % 2 ? `<mark>${esc(part)}</mark>` : esc(part)).join("");
}
function renderNotes() {
  const q = S.query.trim(), ql = q.toLowerCase();
  const items = Object.keys(S.days).sort().reverse()
    .map(k => [k, S.days[k]])
    .filter(([, d]) => d.note.trim() && (!ql || [d.note, ...[...d.meds, ...d.triggers, ...d.symptoms].map(nameOf)].some(t => t.toLowerCase().includes(ql))));
  const box = $("notesList");
  if (!items.length) {
    box.innerHTML = q
      ? `<div class="empty"><strong>${tr("noHitsT")}</strong><span>${esc(tr("noHits", q))}</span></div>`
      : `<div class="empty"><strong>${tr("noNotesT")}</strong><span>${tr("noNotes")}</span><button class="btn" data-act="tab" data-v="tag">${tr("writeNote")}</button></div>`;
    return;
  }
  const groups = new Map();
  items.forEach(it => { const ym = it[0].slice(0, 7); (groups.get(ym) ?? groups.set(ym, []).get(ym)).push(it); });
  box.innerHTML = [...groups].map(([ym, list]) =>
    `<div class="monthgroup"><div class="eyebrow">${fmtMonth.format(parseKey(ym + "-01"))} ${ym.slice(0, 4)} · ${tr("nNotes", list.length)}</div>` +
    list.map(([k, d]) => `
      <button class="note-item" data-act="openDay" data-v="${k}">
        <div class="top"><strong>${fmtShort.format(parseKey(k))}</strong>${d.type ? `<span class="badge ${d.type === "migraine" ? "mig" : "head"}">${typeName(d.type)}${d.intensity ? ` · ${d.intensity}/10` : ""}</span>` : ""}</div>
        <p>${highlight(d.note, q)}</p>
        ${d.meds.length || d.triggers.length || d.symptoms.length ? `<div class="minichips">${
          d.meds.map(t => `<span class="med">${doseOf(d, t) > 1 ? doseOf(d, t) + "× " : ""}${esc(nameOf(t))}</span>`).join("")}${
          [...d.triggers, ...d.symptoms].map(t => `<span>${esc(nameOf(t))}</span>`).join("")}</div>` : ""}
      </button>`).join("") + `</div>`
  ).join("");
}

// ---------- Tab „Statistik“ ----------
function renderStats() {
  $("rangeSeg").innerHTML = RANGES.map(v => `<button data-act="range" data-v="${v}" aria-pressed="${S.range === v}">${tr("r" + v)}</button>`).join("");
  const tk = todayKey(), body = $("statsBody");
  const keys = Object.keys(S.days).filter(k => k <= tk && !isEmptyDay(S.days[k])).sort();
  if (!keys.length) {
    body.innerHTML = `<div class="empty"><strong>${tr("noDataT")}</strong><span>${tr("noData")}</span><button class="btn" data-act="tab" data-v="tag">${tr("firstDay")}</button></div>`;
    return;
  }
  const start = S.range === "all" ? keys[0] : addDays(tk, 1 - Number(S.range));
  const inR = keys.filter(k => k >= start);
  const months = Math.max(1, (daysBetween(start, tk) + 1) / 30.44);
  const mig = inR.filter(k => S.days[k].type === "migraine");
  const head = inR.filter(k => S.days[k].type === "headache");
  const ints = [...mig, ...head].map(k => S.days[k].intensity).filter(Boolean);
  const lastMig = keys.filter(k => S.days[k].type === "migraine").pop();
  const since = lastMig ? daysBetween(lastMig, tk) : null;
  const chart = monthChart(inR, start, tk);

  body.innerHTML = `<div class="tiles">
      <div class="tile mig"><b>${mig.length}</b><span>${tr("migDays")}</span></div>
      <div class="tile head"><b>${head.length}</b><span>${tr("headDays")}</span></div>
      <div class="tile"><b>${f1(mig.length / months)}</b><span>${tr("migPM")}</span></div>
      <div class="tile"><b>${since ?? "–"}</b><span>${since === null ? tr("sinceNone") : tr("since", since)}</span></div>
      <div class="tile"><b>${f1(head.length / months)}</b><span>${tr("headPM")}</span></div>
      <div class="tile"><b>${ints.length ? f1(ints.reduce((a, b) => a + b, 0) / ints.length) : "–"}</b><span>${tr("avgInt")}</span></div>
    </div>
    <div class="panel"><h2>${tr("perMonth")}${chart.cut ? tr("last12") : ""}</h2>${chart.svg}<div class="legend"><span><i class="sw mig"></i>${tr("migraine")}</span><span><i class="sw head"></i>${tr("headache")}</span></div></div>` +
    rankPanel(tr("topT"), mig, "triggers", "var(--mig)", tr("noT")) +
    rankPanel(tr("topS"), mig, "symptoms", "var(--head)", tr("noS")) +
    medPanel(inR, months) +
    weekdayPanel(tr("wdMig"), mig, "var(--mig)", tr("noWdMig")) +
    weekdayPanel(tr("wdHead"), head, "var(--head)", tr("noWdHead"));
}

function monthChart(inR, start, end) {
  const per = counter();
  inR.forEach(k => { const t = S.days[k].type; if (t) inc(per, k.slice(0, 7) + t); });
  const months = [];
  for (const d = parseKey(start.slice(0, 7) + "-01"); keyOf(d) <= end; d.setMonth(d.getMonth() + 1)) months.push(keyOf(d).slice(0, 7));
  const data = months.slice(-12).map(ym => ({ ym, m: per[ym + "migraine"] || 0, h: per[ym + "headache"] || 0 }));
  const max = Math.max(1, ...data.map(x => x.m + x.h));
  const step = max <= 5 ? 1 : max <= 10 ? 2 : max <= 20 ? 5 : 10;
  const top = Math.ceil(max / step) * step;
  const W = 340, H = 170, Lp = 24, R = 6, T = 10, B = 24;
  const cw = (W - Lp - R) / data.length, bw = Math.min(26, cw * 0.62);
  const y = v => T + (H - T - B) * (1 - v / top);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${tr("chartAria")}">`;
  for (let v = 0; v <= top; v += step) s += `<line x1="${Lp}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${Lp - 6}" y="${y(v) + 3.5}" text-anchor="end">${v}</text>`;
  data.forEach((x, i) => {
    const cx = Lp + cw * i + cw / 2, x0 = cx - bw / 2;
    if (x.m) s += `<rect x="${x0}" y="${y(x.m)}" width="${bw}" height="${y(0) - y(x.m)}" rx="3" fill="var(--mig)"/>`;
    if (x.h) s += `<rect x="${x0}" y="${y(x.m + x.h)}" width="${bw}" height="${y(x.m) - y(x.m + x.h)}" rx="3" fill="var(--head)"/>`;
    s += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${fmtMonthShort.format(parseKey(x.ym + "-01")).replace(".", "")}</text>`;
  });
  return { svg: s + `</svg>`, cut: months.length > 12 };
}

// Rangliste nur über Migränetage (bei Kopfschmerzen gibt es keine Trigger/Aura)
function rankPanel(title, migKeys, field, color, emptyMsg) {
  const cnt = counter(), total = migKeys.length;
  migKeys.forEach(k => S.days[k][field].forEach(t => inc(cnt, t)));
  const rows = sortByCount(cnt).slice(0, 10);
  const head = `<h2>${title}</h2><p class="muted small lead">${tr("onlyMig")}</p>`;
  if (!rows.length) return `<div class="panel">${head}<p class="muted small">${total ? emptyMsg : tr("noMig")}</p></div>`;
  const max = rows[0][1];
  return `<div class="panel">${head}<div class="rank">${rows.map(([n, c], i) => `
    <div class="rank-row" style="--fill:${color}">
      <span class="pos">${i + 1}.</span><span class="name">${esc(nameOf(n))}</span><span class="val">${c}×</span>
      <span class="bar"><i style="width:${(c / max) * 100}%"></i></span>
      <span class="sub">${tr("inAttacks", c, total, Math.round((c / total) * 100))}</span>
    </div>`).join("")}</div></div>`;
}

function medPanel(inR, months) {
  const withMeds = inR.filter(k => S.days[k].meds.length);
  const head = `<h2>${tr("secM")}</h2>`;
  if (!withMeds.length) return `<div class="panel">${head}<p class="muted small">${tr("noMeds")}</p></div>`;
  const days = counter(), doses = counter(), byMig = counter(), byHead = counter();
  let total = 0;
  withMeds.forEach(k => {
    const d = S.days[k];
    d.meds.forEach(m => {
      const n = doseOf(d, m);
      inc(days, m); inc(doses, m, n); total += n;
      if (d.type === "migraine") inc(byMig, m);
      if (d.type === "headache") inc(byHead, m);
    });
  });
  const perMonth = withMeds.length / months, rows = sortByCount(days), max = rows[0][1];
  return `<div class="panel">${head}
    <div class="tiles">
      <div class="tile"><b>${withMeds.length}</b><span>${tr("medDays")}</span></div>
      <div class="tile"><b>${f1(perMonth)}</b><span>${tr("medPM")}</span></div>
      <div class="tile"><b>${total}</b><span>${tr("doses")}</span></div>
      <div class="tile"><b>${f1(total / withMeds.length)}</b><span>${tr("dosesPD")}</span></div>
    </div>
    ${perMonth >= 10 ? `<p class="msg err">${tr("overuse")}</p>` : ""}
    <div class="rank">${rows.map(([n, c], i) => `
      <div class="rank-row" style="--fill:var(--fg)">
        <span class="pos">${i + 1}.</span><span class="name">${esc(nameOf(n))}</span><span class="val">${tr("nDays", c)}</span>
        <span class="bar"><i style="width:${(c / max) * 100}%"></i></span>
        <span class="sub">${tr("medSub", doses[n], byMig[n] || 0, byHead[n] || 0)}</span>
      </div>`).join("")}</div></div>`;
}

function weekdayPanel(title, keys, color, emptyMsg) {
  if (!keys.length) return `<div class="panel"><h2>${title}</h2><p class="muted small">${emptyMsg}</p></div>`;
  const wd = [0, 0, 0, 0, 0, 0, 0];
  keys.forEach(k => wd[(parseKey(k).getDay() + 6) % 7]++);
  const max = Math.max(...wd);
  return `<div class="panel"><h2>${title}</h2><div class="wkd">${L.weekdays.map((n, i) =>
    `<div><span>${wd[i]}</span><i style="height:${(wd[i] / max) * 70}%;background:${color}"></i>${n}</div>`).join("")}</div></div>`;
}

// ---------- Tab „Einstellungen“ ----------
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
let installPrompt = null; // Android/Chrome: Installationsdialog, den die App selbst öffnen darf

function renderSettings() {
  const install = isStandalone() ? `<p class="msg">${tr("installed")}</p>`
    : installPrompt ? `<div><button class="btn" data-act="install">${tr("installBtn")}</button></div>`
    : `<p class="muted small">${tr(isIOS ? "installIos" : "installOther")}</p>`;
  $("setBody").innerHTML =
    `<div class="panel"><h2>${tr("language")}</h2><div class="seg" role="group" aria-label="${tr("language")}">` +
      [["de", "Deutsch"], ["en", "English"]].map(([v, l]) => `<button data-act="lang" data-v="${v}" aria-pressed="${lang === v}" lang="${v}">${l}</button>`).join("") +
    `</div></div>` +
    dataPanel() +
    `<div class="panel"><h2>${tr("installT")}</h2>${install}</div>` +
    `<div class="panel"><h2>${tr("aboutT")}</h2><p class="muted small">${tr("about")}</p></div>`;
}

// ---------- Sicherung & Import ----------
function dataPanel() {
  let h = `<div class="panel" id="dataPanel"><h2>${tr("dataT")}</h2>`;
  if (S.imp) {
    const p = S.imp.p, keys = Object.keys(p.days).sort();
    const existing = Object.keys(S.days).filter(k => !isEmptyDay(S.days[k])).length;
    const overlap = keys.filter(k => S.days[k] && !isEmptyDay(S.days[k])).length;
    const nCustom = KIND_KEYS.reduce((n, kind) => n + p[KINDS[kind].custom].length, 0);
    const nType = t => keys.filter(k => p.days[k].type === t).length;
    const fd = k => fmtDate.format(parseKey(k));
    h += `<div class="importbox"><strong>${esc(p.fileName)}</strong>
      <span class="small">${tr("impSummary", keys.length, fd(keys[0]), fd(keys[keys.length - 1]), nType("migraine"), nType("headache"))}${overlap ? tr("impOverlap", overlap) : ""}${nCustom ? tr("impCustom", nCustom) : ""}</span>`;
    h += S.imp.confirm
      ? `<p class="msg err">${tr("replaceWarn", existing)}</p>
         <div class="btnrow"><button class="btn danger" data-act="importReplaceGo">${tr("replaceGo")}</button><button class="btn ghost" data-act="importBack">${tr("back")}</button></div>`
      : `<div class="opt"><button class="btn" data-act="importMerge">${tr("merge")}</button><span>${tr("mergeInfo")}</span></div>` +
        (existing ? `<div class="opt"><button class="btn ghost" data-act="importReplace">${tr("replace")}</button><span>${tr("replaceInfo")}</span></div>` : "") +
        `<div><button class="linkbtn" data-act="importCancel">${tr("cancel")}</button></div>`;
    h += `</div>`;
  } else {
    const last = readNum(BACKUP_KEY), ago = last ? Math.floor((Date.now() - last) / DAY_MS) : null;
    h += `<p class="muted small">${tr("dataInfo")}</p>
      <div class="subhead">${tr("exportH")}</div>
      <div class="btnrow"><button class="btn ghost" data-act="exportJson">${tr("saveBackup")}</button><button class="btn ghost" data-act="exportCsv">${tr("csvBtn")}</button></div>
      <span class="muted small">${ago === null ? tr("noBackup") : tr("lastBackup", ago)}</span>
      <div class="subhead">${tr("importH")}</div>
      <div class="btnrow"><button class="btn" data-act="importPick">${tr("pickFile")}</button></div>
      <span class="muted small">${tr("importInfo")}</span>`;
    if (S.importMsg) h += `<p class="msg${S.importErr ? " err" : ""}">${esc(S.importMsg)}</p>`;
  }
  return h + `</div>`;
}

function jsonExport() {
  const days = {};
  Object.keys(S.days).sort().forEach(k => { if (!isEmptyDay(S.days[k])) days[k] = S.days[k]; });
  return JSON.stringify({ app: "migraene-tagebuch", version: 1, exportedAt: new Date().toISOString(), ...lists(), days }, null, 2);
}

function csvExport() {
  // Zellen, die mit = + - @ beginnen, würde Excel als Formel lesen → mit ' als Text markieren
  const cell = v => { let s = String(v ?? ""); if (/^[=+\-@]/.test(s)) s = "'" + s; return `"${s.replace(/"/g, '""')}"`; };
  const rows = [L.csvHead];
  Object.keys(S.days).sort().forEach(k => {
    const d = S.days[k];
    if (isEmptyDay(d)) return;
    rows.push([k, typeName(d.type), d.intensity || "",
      d.meds.map(m => (doseOf(d, m) > 1 ? doseOf(d, m) + "x " : "") + nameOf(m)).join(" | "),
      d.triggers.map(nameOf).join(" | "), d.symptoms.map(nameOf).join(" | "), d.note]);
  });
  return "﻿" + rows.map(r => r.map(cell).join(";")).join("\r\n");
}

function parseCSV(text) {
  const first = text.split(/\r?\n/)[0] || "";
  const delim = (first.match(/;/g) || []).length >= (first.match(/,/g) || []).length ? ";" : ",";
  const rows = [];
  let row = [], field = "", quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c !== '"') field += c;
      else if (text[i + 1] === '"') { field += '"'; i++; }
      else quoted = false;
    } else if (c === '"') quoted = true;
    else if (c === delim) { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); rows.push(row); row = []; field = "";
    } else field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}

function normDate(s) {
  s = String(s ?? "").trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/), k = null;
  if (m) k = `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  else if ((m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/))) k = `${m[3]}-${pad(+m[2])}-${pad(+m[1])}`;
  return k && isDateKey(k) ? k : null;
}

function parseImport(text, fileName) {
  text = text.replace(/^﻿/, "");
  const days = {}, customs = Object.fromEntries(LIST_KEYS.map(k => [k, []]));
  const add = (date, raw) => { const k = normDate(date), d = normDay(raw); if (k && !isEmptyDay(d)) days[k] = d; };
  if (/^\s*[[{]/.test(text)) {
    let obj;
    try { obj = JSON.parse(text); } catch { throw new Error(tr("errJson")); }
    const src = Array.isArray(obj) ? obj : obj?.days;
    if (Array.isArray(src)) src.forEach(d => add(d?.date, d));
    else Object.entries(src || {}).forEach(([k, d]) => add(k, d));
    LIST_KEYS.forEach(k => { customs[k] = strList(obj?.[k]); });
  } else {
    const rows = parseCSV(text).map(r => r.map(c => c.replace(/^'(?=[=+\-@])/, "")));
    if (rows.length < 2) throw new Error(tr("errRows"));
    const head = rows[0].map(h => h.trim().toLowerCase());
    const col = (...names) => head.findIndex(h => names.some(n => h.startsWith(n)));
    const iDate = col("datum", "date"), iType = col("art", "typ", "type"), iInt = col("stärke", "staerke", "intensity"),
          iMed = col("medikament", "medication", "schmerzmittel", "meds"), iTrig = col("trigger"), iSym = col("aura", "symptom"), iNote = col("notiz", "note");
    if (iDate < 0) throw new Error(tr("errDate"));
    const cell = (r, i) => (i >= 0 ? r[i] || "" : "").trim();
    // Namen in beiden Sprachen erkennen und als gespeicherten (deutschen) Namen übernehmen
    // Trenner „|“ (ab dieser Version, erlaubt Kommas in Namen); ältere Tabellen nutzen „,“
    const split = v => v.split(v.includes("|") ? "|" : ",").map(x => canonical(x.trim())).filter(Boolean);
    rows.slice(1).forEach(r => {
      const t = cell(r, iType).toLowerCase(), meds = [], medCounts = {};
      // Medikamente enthalten Kommas („2,5 mg“), daher nur an „|“ trennen; „2x Name“ = Anzahl
      cell(r, iMed).split("|").map(x => x.trim()).filter(Boolean).forEach(item => {
        const m = item.match(/^(\d+)\s*[x×]\s+(.+)$/i), name = canonical(m ? m[2].trim() : item);
        if (!meds.includes(name)) meds.push(name);
        if (m && +m[1] > 1) medCounts[name] = +m[1];
      });
      add(cell(r, iDate), {
        type: t.startsWith("mig") ? "migraine" : t.startsWith("kopf") || t.startsWith("head") ? "headache" : null,
        intensity: parseInt(cell(r, iInt), 10),
        triggers: split(cell(r, iTrig)),
        symptoms: split(cell(r, iSym)),
        meds, medCounts,
        note: iNote >= 0 ? r[iNote] || "" : ""
      });
    });
  }
  // Einträge, die nicht in den Standardlisten stehen, als eigene übernehmen
  Object.values(days).forEach(d => KIND_KEYS.forEach(kind => {
    const K = KINDS[kind];
    customs[K.custom] = union(customs[K.custom], d[K.field].filter(v => !K.defaults.includes(v)));
  }));
  if (!Object.keys(days).length) throw new Error(tr("errEmpty"));
  return { fileName, days, ...customs };
}

function runImport(replace) {
  const p = S.imp?.p;
  if (!p) return;
  // Zusammenführen: eigene Einträge vereinigen, gelöschte Standardeinträge so lassen wie sie jetzt sind
  KIND_KEYS.forEach(kind => {
    const { custom, hidden } = KINDS[kind];
    S[custom] = replace ? p[custom].slice() : union(S[custom], p[custom]);
    if (replace) S[hidden] = p[hidden].slice();
  });
  if (replace) S.days = {};
  Object.assign(S.days, p.days);
  save();
  S.imp = null;
  S.importMsg = tr("imported", Object.keys(p.days).length);
  S.importErr = false;
  toast(tr("importDone"));
  renderAll();
}

async function giveFile(isJson) {
  const data = isJson ? jsonExport() : csvExport();
  const filename = `${tr("file")}-${todayKey()}.${isJson ? "json" : "csv"}`;
  const file = new File([data], filename, { type: isJson ? "application/json" : "text/csv" });
  const done = () => {
    toast(tr(isJson ? "backupSaved" : "csvSaved"));
    if (isJson) writeLS(BACKUP_KEY, String(Date.now()));
    renderAll();
  };
  // iPhone: Teilen-Menü („In Dateien sichern“, AirDrop, Mail …)
  if (isIOS && navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], title: filename }); done(); }
    catch (err) { if (err?.name !== "AbortError") toast(tr("shareFailed")); }
    return;
  }
  // Android & Computer: normaler Download (landet im Ordner „Downloads“)
  const url = URL.createObjectURL(file), a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  done();
}

// Erinnerung: die erste nach einer Woche Nutzung, danach alle 30 Tage
function renderBackupHint() {
  const box = $("backupBox"), keys = Object.keys(S.days).sort();
  const last = readNum(BACKUP_KEY), now = Date.now();
  const due = keys.length > 0 && now > readNum(SNOOZE_KEY) &&
    (last ? now - last > 30 * DAY_MS : daysBetween(keys[0], todayKey()) >= 7);
  box.hidden = !due;
  if (!due) return;
  const ago = last ? Math.floor((now - last) / DAY_MS) : null;
  box.innerHTML = `<strong>${tr("backupT")}</strong>
    <span>${ago === null ? tr("backupNever") : tr("backupAgo", ago)} ${tr("backupWhy")}</span>
    <div class="btnrow"><button class="btn" data-act="exportJson">${tr("backupNow")}</button><button class="btn ghost" data-act="backupLater">${tr("backupLater")}</button></div>`;
}

// ---------- Tabs (die Android-Zurück-Taste führt von anderen Tabs zurück zu „Tag“) ----------
const TABS = { tag: renderTag, cal: renderCal, notes: renderNotes, stats: renderStats, set: renderSettings };
function renderAll() {
  for (const t in TABS) $("v-" + t).hidden = S.tab !== t;
  document.querySelectorAll(".tabbar button").forEach(b => b.setAttribute("aria-selected", b.dataset.v === S.tab));
  TABS[S.tab]();
}
function setTab(t, fromHistory = false) {
  if (!TABS[t]) t = "tag";
  if (!fromHistory) {
    if (t !== "tag") history[S.tab === "tag" ? "pushState" : "replaceState"]({ tab: t }, "");
    else if (history.state?.tab) history.back();
  }
  S.tab = t;
  renderAll();
  window.scrollTo(0, 0);
}
window.addEventListener("popstate", () => setTab(history.state?.tab || "tag", true));

// ---------- Bedienung ----------
document.addEventListener("click", e => {
  if (suppressClick && e.target.closest(".chip")) { e.preventDefault(); return; }
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (syncToday()) renderAll();
  const { act, v, k: kind } = el.dataset;
  switch (act) {
    case "setType":
      mutate(d => { if (d.type === v) { d.type = null; d.intensity = null; } else d.type = v; });
      toast(getDay(S.date).type ? tr("typeSet", typeName(v)) : tr("typeCleared"));
      renderTag(); break;
    case "setInt": mutate(d => { d.intensity = d.intensity === +v ? null : +v; }); renderTag(); break;
    case "tog": mutate(d => { const a = d[KINDS[kind].field], i = a.indexOf(v); i >= 0 ? a.splice(i, 1) : a.push(v); }); renderTag(); break;
    case "doseInc": mutate(d => { d.medCounts[v] = Math.min(doseOf(d, v) + 1, MAX_DOSE); }); renderTag(); break;
    case "doseDec": mutate(d => { const n = doseOf(d, v); if (n > 1) d.medCounts[v] = n - 1; else d.meds = d.meds.filter(x => x !== v); }); renderTag(); break;
    case "add": S.adding = kind; renderTag(); $("addInput")?.focus(); break;
    case "cancelAdd": S.adding = null; renderTag(); break;
    case "restore": S[KINDS[kind].hidden] = []; save(); toast(tr("defaultsBack")); renderTag(); break;
    case "prevDay": goDay(addDays(S.date, -1)); renderTag(); break;
    case "nextDay": if (S.date < todayKey()) { goDay(addDays(S.date, 1)); renderTag(); } break;
    case "goToday": goDay(todayKey()); renderTag(); break;
    case "openDay": goDay(v); setTab("tag"); break;
    case "prevMonth": case "nextMonth": {
      const d = parseKey(S.calMonth + "-01");
      d.setMonth(d.getMonth() + (act === "nextMonth" ? 1 : -1));
      S.calMonth = keyOf(d).slice(0, 7);
      renderCal(); break;
    }
    case "tab": setTab(v); break;
    case "range": S.range = v; renderStats(); break;
    case "lang": writeLS(LANG_KEY, v); setLang(v); renderAll(); break;
    case "install":
      try { installPrompt?.prompt()?.catch(() => {}); } catch {}
      installPrompt = null; renderSettings(); break;
    case "exportJson": giveFile(true); break;
    case "exportCsv": giveFile(false); break;
    case "backupLater": writeLS(SNOOZE_KEY, String(Date.now() + 7 * DAY_MS)); renderBackupHint(); break;
    case "importPick": { const f = $("importFile"); f.value = ""; f.click(); break; }
    case "importMerge": runImport(false); break;
    case "importReplace": S.imp.confirm = true; renderSettings(); break;
    case "importBack": S.imp.confirm = false; renderSettings(); break;
    case "importReplaceGo": runImport(true); break;
    case "importCancel": S.imp = null; S.importMsg = ""; renderSettings(); break;
  }
});

// Eigenen Eintrag hinzufügen (auch in der anderen Sprache geschriebene Standardnamen werden erkannt)
document.addEventListener("submit", e => {
  const form = e.target.closest("form[data-form]");
  if (!form) return;
  e.preventDefault();
  const K = KINDS[form.dataset.form], input = form.querySelector("input");
  const val = input.value.trim().replace(/\s+/g, " ").replace(/\|/g, "/"); // „|“ trennt Einträge in der CSV
  if (!val) { input.focus(); return; }
  const low = val.toLowerCase();
  const existing = [...K.defaults, ...S[K.custom]].find(x => x.toLowerCase() === low || nameOf(x).toLowerCase() === low || canonical(val) === x);
  const name = existing || val;
  if (!existing) S[K.custom] = [...S[K.custom], name];
  S[K.hidden] = S[K.hidden].filter(x => x !== name);
  S.adding = null;
  mutate(d => { if (!d[K.field].includes(name)) d[K.field].push(name); });
  toast(tr(existing ? "picked" : "added", nameOf(name)));
  renderTag();
});

// ---------- Gedrückt halten → in den Papierkorb ziehen ----------
const trash = $("trash");
let press = null, suppressClick = false, lastTouch = 0;

function pressStart(chip, x, y) {
  pressCancel();
  press = { chip, kind: chip.dataset.k, value: chip.dataset.v, x, y, dragging: false };
  chip.classList.add("pressing");
  press.timer = setTimeout(startDrag, HOLD_MS);
}
function pressCancel() {
  if (!press) return;
  clearTimeout(press.timer);
  press.chip.classList.remove("pressing", "lifted");
  press.ghost?.remove();
  trash.classList.remove("show", "hot");
  press = null;
}
function startDrag() {
  const p = press;
  if (!p || !p.chip.isConnected) { pressCancel(); return; }
  const r = p.chip.getBoundingClientRect();
  p.dragging = true;
  p.offX = p.x - r.left;
  p.offY = p.y - r.top;
  p.ghost = Object.assign(document.createElement("div"), { className: "chip ghost", textContent: nameOf(p.value) });
  document.body.appendChild(p.ghost);
  p.chip.classList.remove("pressing");
  p.chip.classList.add("lifted");
  suppressClick = true;
  moveGhost(p.x, p.y);
  trash.classList.add("show");
  if (navigator.userActivation?.hasBeenActive) try { navigator.vibrate?.(25); } catch {}
}
function overTrash(x, y) {
  const r = trash.getBoundingClientRect(), m = 28;
  return x > r.left - m && x < r.right + m && y > r.top - m && y < r.bottom + m;
}
function moveGhost(x, y) {
  press.ghost.style.transform = `translate(${x - press.offX}px, ${y - press.offY}px) scale(1.06)`;
  trash.classList.toggle("hot", overTrash(x, y));
}
// true, solange gezogen wird (dann darf die Seite nicht scrollen)
function pressMove(x, y) {
  if (!press) return false;
  if (press.dragging) { moveGhost(x, y); return true; }
  if (Math.hypot(x - press.x, y - press.y) > 10) pressCancel();
  return false;
}
function pressEnd(x, y) {
  if (!press) return;
  const { dragging, kind, value } = press;
  const drop = dragging && overTrash(x, y);
  pressCancel();
  if (drop) deleteItem(kind, value);
  if (dragging) setTimeout(() => { suppressClick = false; }, 400);
}
const holdChip = t => t.closest?.('.chip[data-act="tog"]:not(.orphan)');

document.addEventListener("touchstart", e => {
  lastTouch = Date.now();
  const chip = holdChip(e.target);
  if (!chip || e.touches.length > 1) { pressCancel(); return; }
  pressStart(chip, e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });
document.addEventListener("touchmove", e => {
  if (press && pressMove(e.touches[0].clientX, e.touches[0].clientY)) e.preventDefault();
}, { passive: false });
document.addEventListener("touchend", e => {
  lastTouch = Date.now();
  if (!press) return;
  if (press.dragging) e.preventDefault();
  pressEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
}, { passive: false });
document.addEventListener("touchcancel", pressCancel);
// Maus (Computer): gleiche Geste mit gedrückter Maustaste; Maus-Ereignisse direkt nach Touch ignorieren
const fromTouch = () => Date.now() - lastTouch < 800;
document.addEventListener("mousedown", e => {
  const chip = e.button === 0 && !fromTouch() && holdChip(e.target);
  if (chip) pressStart(chip, e.clientX, e.clientY);
});
document.addEventListener("mousemove", e => { if (press && !fromTouch()) pressMove(e.clientX, e.clientY); });
document.addEventListener("mouseup", e => { if (!fromTouch()) pressEnd(e.clientX, e.clientY); });
// Android öffnet beim langen Drücken sonst ein Kontextmenü
document.addEventListener("contextmenu", e => { if (holdChip(e.target)) e.preventDefault(); });

// ---------- Notiz, Suche, Import-Datei ----------
let hintTimer;
$("note").addEventListener("input", e => {
  const ta = e.target;
  if (ta.dataset.date !== S.date) return;
  mutate(d => { d.note = ta.value; }, true);
  $("saveHint").textContent = "";
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => { $("saveHint").textContent = tr("noteSaved"); }, 450);
});
$("note").addEventListener("blur", flush);
$("noteSearch").addEventListener("input", e => { S.query = e.target.value; renderNotes(); });
$("importFile").addEventListener("change", async e => {
  const file = e.target.files?.[0];
  if (!file) return;
  S.importMsg = "";
  S.importErr = false;
  try {
    if (file.size > 5 * 1024 * 1024) throw new Error(tr("errSize"));
    S.imp = { p: parseImport(await file.text(), file.name), confirm: false };
  } catch (err) {
    S.imp = null;
    S.importMsg = err.message || tr("errRead");
    S.importErr = true;
  }
  setTab("set");
  $("dataPanel")?.scrollIntoView({ block: "center", behavior: "smooth" });
});

// ---------- Hintergrund, Mitternacht, mehrere Fenster, Installation ----------
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { flush(); return; }
  syncToday();
  renderAll();
});
window.addEventListener("pagehide", flush);
// Anderes Fenster hat gespeichert: dessen Stand übernehmen, eine hier noch ungespeicherte Notiz behalten
window.addEventListener("storage", e => {
  if (e.key !== DATA_KEY) return;
  const pending = saveTimer ? S.days[S.date] : null;
  load();
  if (pending) { S.days[S.date] = pending; save(); }
  renderAll();
});
// Chrome-eigenes Installations-Banner zulassen; das Ereignis zusätzlich für den Knopf in den Einstellungen merken
window.addEventListener("beforeinstallprompt", e => { installPrompt = e; if (S.tab === "set") renderSettings(); });
window.addEventListener("appinstalled", () => { installPrompt = null; if (S.tab === "set") renderSettings(); });

// ---------- Start ----------
setLang(readLS(LANG_KEY) || ((navigator.language || "de").toLowerCase().startsWith("de") ? "de" : "en"));
load();
history.replaceState(null, "");
renderAll();
try { navigator.storage?.persist?.()?.catch(() => {}); } catch {}
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
})();
</script>
